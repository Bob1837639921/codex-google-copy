<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 250px; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    h3 { margin-top: 0; color: #333; }
    #status { font-weight: bold; color: #28a745; }
    .note { font-size: 12px; color: #666; margin-top: 10px; }
  </style>
</head>
<body>
  <h3>🧠 AI 浏览器控制中枢</h3>

  <p class="note">此插件允许本地 AI 助手在不打扰你的情况下，通过最小化的后台窗口为你自动执行网页任务。</p>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      width: 288px;
      margin: 0;
      padding: 14px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #17202a;
      background: #f4f6f8;
      letter-spacing: 0;
    }
    .panel {
      padding: 14px;
      border: 1px solid #d8dee5;
      border-radius: 6px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(23, 32, 42, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 650;
    }
    .status {
      display: flex;
      align-items: center;
      min-height: 38px;
      gap: 9px;
      padding: 9px 10px;
      border: 1px solid #e2e6ea;
      border-radius: 5px;
      background: #f8f9fa;
    }
    .indicator {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: #7b8794;
    }
    .indicator.connected { background: #16845b; }
    .indicator.connecting { background: #c77800; animation: pulse 1.2s infinite; }
    .indicator.paused { background: #c0392b; }
    #status-text { font-size: 12px; line-height: 1.45; }
    .actions { display: grid; gap: 7px; margin-top: 10px; }
    button {
      width: 100%;
      min-height: 32px;
      padding: 7px 10px;
      border: 1px solid #176b87;
      border-radius: 5px;
      color: #ffffff;
      background: #176b87;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #125a72; }
    button.danger { border-color: #b03a2e; background: #b03a2e; }
    button.danger:hover { background: #922b21; }
    .note {
      margin: 10px 0 0;
      color: #566573;
      font-size: 11px;
      line-height: 1.5;
    }
    @keyframes pulse { 50% { opacity: 0.35; } }
  </style>
</head>
<body>
  <main class="panel">
    <h1>NodeX Browser Agent</h1>
    <div class="status" aria-live="polite">
      <span id="indicator" class="indicator"></span>
      <span id="status-text">正在读取连接状态...</span>
    </div>
    <div class="actions">
      <button id="btn-reconnect" type="button" hidden>连接本地服务</button>
      <button id="btn-disconnect" class="danger" type="button" hidden>断开连接</button>
    </div>
    <p class="note">打开任意 HTTP/HTTPS 页面后，扩展会连接本地 NodeX 桥接服务。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
